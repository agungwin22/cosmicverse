<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Latar ruang gelap -->
    <radialGradient id="cvBg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1B2130"/>
      <stop offset="1" stop-color="#0B0D12"/>
    </radialGradient>

    <!-- Bola planet oranye pijar -->
    <radialGradient id="cvPlanet" cx="34%" cy="30%" r="80%">
      <stop offset="0"    stop-color="#FFE7BF"/>
      <stop offset="0.32" stop-color="#FFAA00"/>
      <stop offset="0.68" stop-color="#FF6B00"/>
      <stop offset="1"    stop-color="#7E2E00"/>
    </radialGradient>

    <!-- Cincin dengan efek fade di kedua ujung -->
    <linearGradient id="cvRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FF6B00" stop-opacity=".25"/>
      <stop offset="0.5" stop-color="#FFD27A" stop-opacity="1"/>
      <stop offset="1"   stop-color="#FF6B00" stop-opacity=".25"/>
    </linearGradient>

    <!-- Pendar glow -->
    <filter id="cvGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel latar -->
  <rect width="64" height="64" rx="15" fill="url(#cvBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#FF6B00" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- Bintang-bintang kecil -->
  <circle cx="14"   cy="15"   r="1.3" fill="#F3F4F6" opacity=".9"/>
  <circle cx="51"   cy="13.5" r="1"   fill="#F3F4F6" opacity=".65"/>
  <circle cx="50"   cy="51"   r="1.2" fill="#FFAA00" opacity=".7"/>
  <circle cx="13.5" cy="49"   r="0.9" fill="#F3F4F6" opacity=".5"/>

  <!-- Cincin bagian belakang (di belakang planet) -->
  <g transform="rotate(-18 32 32)" opacity=".55">
    <path d="M9 32 A23 7.5 0 0 1 55 32"
          fill="none" stroke="url(#cvRing)" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Planet -->
  <circle cx="32" cy="32" r="13" fill="url(#cvPlanet)" filter="url(#cvGlow)"/>

  <!-- Cincin bagian depan (melintas di atas planet) -->
  <g transform="rotate(-18 32 32)">
    <path d="M9 32 A23 7.5 0 0 0 55 32"
          fill="none" stroke="url(#cvRing)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>